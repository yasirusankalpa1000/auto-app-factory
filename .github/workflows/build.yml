name: Auto Build App & Deploy to Web

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Structure if missing
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create . --project-name auto_app_factory
          fi

      - name: Generate Flutter App Code via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_app.py

      - name: Fix Gemini Flutter Syntax Errors
        run: |
          sed -i 's/CardTheme(/CardThemeData(/g' lib/main.dart

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/auto-app-factory/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: Send Web Link & Details to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAPTION=$(cat app_info.txt)
          WEB_URL="https://${{ github.repository_owner }}.github.io/auto-app-factory/"
          
          MESSAGE="$CAPTION

          🌐 *Live Web App Link:* $WEB_URL"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
            
