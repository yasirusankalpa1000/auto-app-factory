name: Auto Build App & Send to Telegram

on:
  workflow_dispatch:
  schedule:
    # පැය 5කට සැරයක් auto run වී දවසට ඇප් 5ක් Telegram එකට එවයි (UTC 00:00, 05:00, 10:00, 15:00, 20:00)
    - cron: '0 0,5,10,15,20 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Structure if missing
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create . --project-name auto_app_factory
          fi

      - name: Generate Flutter App Code via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_app.py

      - name: Fix Gemini Flutter Syntax Errors
        run: |
          sed -i 's/CardTheme(/CardThemeData(/g' lib/main.dart

      - name: Save Generated Code to History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/ lib/main.dart
          git commit -m "Save app code history" || exit 0
          git push

      - name: Build Lightweight APK (Split ABI)
        run: flutter build apk --release --split-per-abi

      - name: Send APK & Details to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAPTION=$(cat app_info.txt)
          RESPONSE=$(curl -s -X POST "[https://api.telegram.org/bot$](https://api.telegram.org/bot$){TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
            -F caption="${CAPTION}")
          
          echo "Telegram API Response: $RESPONSE"
          
          if [[ "$RESPONSE" != *"\"ok\":true"* ]]; then
            echo "Error sending document to Telegram!"
            exit 1
          fi
          
